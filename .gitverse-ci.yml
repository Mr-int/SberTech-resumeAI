# GitVerse CI — TODO: подключить после создания репозитория
stages:
  - lint
  - test
  - build

lint:
  stage: lint
  image: python:3.11-slim
  script:
    - pip install ruff
    - ruff check app tests

test:
  stage: test
  image: python:3.11-slim
  script:
    - pip install -e ".[dev]"
    - pytest

build:
  stage: build
  script:
    - docker build -t resume-designer:$CI_COMMIT_SHORT_SHA .
