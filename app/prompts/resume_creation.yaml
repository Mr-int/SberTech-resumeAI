name: resume_creation
description: Пошаговое создание резюме с нуля (Block 1)
locale: ru
version: "0.1"
intent: create_resume

template: |
  Помоги пользователю составить резюме. Сообщение пользователя:
  ---
  {{ user_message }}
  ---

  {% if resume_context %}
  Уже известный контекст резюме:
  {{ resume_context }}
  {% endif %}

  Определи, на каком этапе пользователь (сбор данных / черновик / доработка).
  Задай следующий логичный шаг или предложи черновик секции.
