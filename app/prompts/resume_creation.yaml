name: resume_creation
description: Пошаговое создание резюме с нуля (Block 1)
locale: ru
version: "0.2"
intent: create_resume

template: |
  Помоги пользователю составить резюме в формате HeadHunter.

  {{ resume_structure }}

  Сообщение пользователя:
  ---
  {{ user_message }}
  ---

  {% if resume_context %}
  Уже известный контекст (ответы анкеты / черновик):
  {{ resume_context }}
  {% endif %}

  Задача:
  1. Определи этап: сбор данных / черновик / доработка.
  2. Если данных недостаточно для блоков иерархии HH — задай 2–3 целевых вопроса (по недостающим блокам: личные данные, опыт с метриками, образование, обо мне, языки).
  3. Если данных достаточно — выдай **черновик резюме**, строго соблюдая иерархию HH (п. 1–12): шапка → опыт по местам (от нового к старому) → образование → обо мне → языки → права.
  4. В каждом месте работы: период, длительность, должность, компания (тип, город), список «Обязанности и достижения» с метриками.
  5. Не выдумывай факты — только из контекста пользователя; пропущенные поля помечай «не указано» или проси уточнить.

  Формат черновика: читаемый текст с подзаголовками блоков, как на hh.ru (без HTML).
