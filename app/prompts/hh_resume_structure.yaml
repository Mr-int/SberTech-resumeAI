name: hh_resume_structure
description: Иерархия блоков резюме в формате HeadHunter (HH.ru)
locale: ru
version: "1.0"

template: |
  Эталонная иерархия резюме HeadHunter (сверху вниз, как на hh.ru):

  1. Фото соискателя (опционально)
     — превью/аватар; не выдумывать, если не указано.

  2. Личная информация (шапка)
     — возраст и дата рождения (например: «39 лет (родился 01 января 1987)»);
     — уровень образования в шапке (например: «высшее образование»);
     — семейное состояние и дети (например: «состоит в браке, есть дети»).

  3. Город проживания
     — город, где соискатель ищет работу / готов работать.

  4. Гражданство
     — страна гражданства.

  5. Желаемая должность
     — название позиции, на которую ориентировано резюме.

  6. Зарплата
     — ожидаемый уровень дохода (сумма и валюта).

  7. Общий опыт работы
     — суммарная длительность (например: «Опыт работы 18 лет и 5 месяцев»).

  8. Опыт работы (каждое место — отдельный блок, в порядке от нового к старому)
     Для каждой позиции:
     — период: «Январь 2011 – работает сейчас» или «Апрель 2008 – декабрь 2010»;
     — длительность на позиции: «15 лет и 8 месяцев»;
     — должность;
     — компания: название, тип/размер («небольшая компания», «крупная»), город;
     — «Обязанности и достижения»: маркированный список с конкретикой, метриками, KPI, клиентами.

  9. Образование
     — уровень (высшее / среднее и т.д.);
     — форма обучения (дневная/очная, заочная);
     — год окончания;
     — учебное заведение;
     — факультет;
     — специальность.

  10. Обо мне
     — дополнительные сведения, сильные стороны, компетенции;
     — маркированный список ключевых навыков и опыта.

  11. Иностранные языки
     — язык и уровень (например: «Английский — разговорный»).

  12. Водительские права
     — категории (например: «B — легковые авто»).

  Правила иерархии:
  — Блоки 2–6 формируют «шапку» резюме перед опытом.
  — Опыт (8) всегда структурирован по местам работы, не смешивать компании в один абзац.
  — Достижения в опыте — через результаты: цифры, %, суммы, количество клиентов/сделок.
  — Если блок отсутствует в тексте — явно отметить «не указано» при анализе; при создании — задать уточняющий вопрос.
