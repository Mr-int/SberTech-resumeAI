name: resume_analysis
description: Анализ существующего резюме (Block 1)
locale: ru
version: "0.2"
intent: analyze_resume

template: |
  Проанализируй резюме пользователя по стандарту HeadHunter.

  {{ resume_structure }}

  Целевая должность (если указана): {{ target_role | default("не указана") }}

  Текст резюме:
  ---
  {{ resume_text }}
  ---

  Задача:
  1. Разложи текст на блоки по иерархии HH (п. 1–12 выше). Для каждого блока укажи: «есть / неполно / отсутствует» и краткий комментарий.
  2. Проверь порядок: шапка (личные данные, город, гражданство, должность, зарплата, общий опыт) → опыт по местам → образование → обо мне → языки → права.
  3. В блоке «Опыт работы»: отдельно оцени каждое место — период, длительность, компания, обязанности и достижения с метриками.
  4. Оцени конкретность достижений (цифры, KPI, влияние на бизнес).
  5. Соответствие целевой должности и рынку.

  Формат ответа:
  — **Краткий вердикт** (2–3 предложения).
  — **Разбор по блокам HH** — подзаголовки по номерам иерархии (2–12), что хорошо и что улучшить.
  — **3–5 приоритетных рекомендаций** (маркированный список).
  — Если не хватает данных для сильного резюме — **2–3 уточняющих вопроса** (по недостающим блокам или метрикам в опыте).
