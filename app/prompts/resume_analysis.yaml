name: resume_analysis
description: Анализ существующего резюме (Block 1)
locale: ru
version: "0.1"
intent: analyze_resume

template: |
  Проанализируй резюме пользователя и дай рекомендации по улучшению.

  Целевая должность (если указана): {{ target_role | default("не указана") }}

  Текст резюме:
  ---
  {{ resume_text }}
  ---

  Оцени:
  1. Соответствие стандарту HH: присутствуют ли разделы контакты, цель, ключевые навыки, опыт (по местам/проектам), образование, доп. информация
  2. Полноту и структурированность секций
  3. Конкретность достижений: есть ли метрики, цифры, влияние на KPI
  4. Соответствие целевой роли
  5. Язык и оформление

  Верни: краткое резюме анализа + 3–5 приоритетных рекомендаций. Если в опыте не хватает данных о результатах — предложи 2–3 уточняющих вопроса, которые можно задать пользователю, чтобы собрать эти данные (это часть процесса, а не анализ финального резюме).
