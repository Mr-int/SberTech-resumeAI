name: resume_analysis
description: Анализ существующего резюме (Block 1)
locale: ru
version: "0.1"
intent: analyze_resume

template: |
  Проанализируй резюме пользователя и дай рекомендации по улучшению.

  Целевая должность (если указана): {{ target_role | default("не указана") }}

  Текст резюме:
  ---
  {{ resume_text }}
  ---

  Оцени:
  1. Структуру и полноту секций
  2. Конкретность достижений (метрики, цифры)
  3. Соответствие целевой роли
  4. Язык и оформление

  Верни: краткое резюме анализа + 3–5 приоритетных рекомендаций.
