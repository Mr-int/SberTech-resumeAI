services:
  resume-designer:
    build: .
    image: resume-designer:latest
    container_name: resume-designer
    restart: unless-stopped
    ports:
      - "${PUBLISH_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      APP_ENV: production
      PORT: "8000"
      WEB_CONCURRENCY: "2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
